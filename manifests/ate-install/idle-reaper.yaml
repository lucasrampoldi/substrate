apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-idle-reaper
  namespace: ate-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ate-idle-reaper
rules:
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["services", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["clustertrustbundles"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ate-idle-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ate-idle-reaper
subjects:
- kind: ServiceAccount
  name: ate-idle-reaper
  namespace: ate-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-idle-reaper
  namespace: ate-system
  labels:
    app.kubernetes.io/name: ate-idle-reaper
    app.kubernetes.io/part-of: agent-substrate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ate-idle-reaper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ate-idle-reaper
    spec:
      serviceAccountName: ate-idle-reaper
      imagePullSecrets:
      - name: regcred
      containers:
      - name: ate-idle-reaper
        image: docker.io/sistemascivitatis/ate-idle-reaper:v1.1.0
        imagePullPolicy: Always
        args:
        - "--idle-timeout=2m"
        - "--check-interval=30s"
        - "--endpoint=api.ate-system.svc:443"
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
